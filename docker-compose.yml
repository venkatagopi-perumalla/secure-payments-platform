services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_admin
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_admin -d payments"]
      interval: 5s
      retries: 10

  api:
    build: ./app
    read_only: true
    environment:
      DB_HOST: db
      DB_NAME: payments
      DB_USER: payments_admin
      DB_PASSWORD: local-dev-only
      DB_SSLMODE: disable
      API_KEY: local-dev-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
