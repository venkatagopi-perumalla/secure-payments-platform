name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d payments"
          --health-interval 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: payments
      DB_USER: ci
      DB_PASSWORD: ci-only
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install and test (all 12 tests)
        working-directory: app
        run: |
          pip install -r requirements-dev.txt
          pytest -q

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and secrets (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Terraform for misconfigurations (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  build-and-push:
    needs: [test, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS with the build user
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to the registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build the image
        run: docker build -t "${{ steps.ecr.outputs.registry }}/payments-api:${{ github.sha }}" app

      - name: Scan the image (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/payments-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Create the software bill of materials
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/payments-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Keep the bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Push the image
        run: docker push "${{ steps.ecr.outputs.registry }}/payments-api:${{ github.sha }}"

